name: Build all

on:
  push:
    branches:
     - main
     - master
     - release/*
     - windows
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/*.yml"
     - 'flatpak/**'

  pull_request:
    branches:
     - main
     - master
     - release/*
     - windows
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/*.yml"
     - 'BuildLinux.sh'
     - 'build_release_vs2022.bat'
     - 'build_release_macos.sh'
     - 'flatpak/**'

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  

jobs:
  build_all:
    name: Build All
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  build_linux:
    name: Build Linux (Docker/AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CrealityPrint image (same Dockerfile/Ubuntu 26.04 used locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crealityprint:ci
          build-args: |
            NCORES=2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract AppImage from image
        run: |
          id=$(docker create crealityprint:ci)
          mkdir -p out
          docker cp "$id":/CrealityPrint/build/. out/ || (docker logs "$id"; false)
          docker rm -f "$id"
          ls -la out/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrealityPrint-linux-x86_64-AppImage
          path: out/*.AppImage
  
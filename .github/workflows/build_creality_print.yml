on:
    workflow_call:
      inputs:
        cache-key:
          required: true
          type: string
        cache-path:
          required: true
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string

jobs:
  build_orca:
    name: Build Creality Print
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-latest'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(CREALITYPRINT_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

      - name: Get the version and date on macOS
        if: inputs.os == 'macos-14'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ver="PR${{ github.event.number }}"
          else
            ver_raw=$(grep -m1 'set(CREALITYPRINT_VERSION' version.inc | sed -E 's/.*"([^"]+)".*/\1/')
            ver="V${ver_raw}"
          fi
          echo "ver=$ver" >> "$GITHUB_ENV"
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "date: $(date +'%Y%m%d') version: $ver"

# macOS
      - name: Build slicer macOS
        if: inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x ./build_release_macos.sh
          ./build_release_macos.sh -s -a ${{ inputs.arch }}

      - name: Package DMG (unsigned)
        if: inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        run: |
          APP_PATH="build_check_${{ inputs.arch }}/src/Release/CrealityPrint.app"
          ls -la "$APP_PATH"
          mkdir -p dmg_staging
          cp -pR "$APP_PATH" dmg_staging/
          ln -sf /Applications dmg_staging/Applications
          hdiutil create -volname "CrealityPrint" -srcfolder dmg_staging -ov -format UDZO "CrealityPrint_Mac_${{ inputs.arch }}_${{ env.ver }}.dmg"

      - name: Upload macOS artifact
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: CrealityPrint_Mac_${{ inputs.arch }}_${{ env.ver }}
          path: ${{ github.workspace }}/CrealityPrint_Mac_${{ inputs.arch }}_${{ env.ver }}.dmg

# Windows
      - name: setup MSVC
        if: inputs.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Install nsis
        if: inputs.os == 'windows-latest'
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis

      - name: Download tools
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        run: |
          cd package
          cd runtime
          curl -LJO https://github.com/CrealityOfficial/CrealityPrint/releases/download/tools/MicrosoftEdgeWebView2RuntimeInstallerX64.exe

      - name: Build slicer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.22000.0\'
        run: .\test_build.bat slicer

      # - name: Create installer Win
      #   if: inputs.os == 'windows-latest'

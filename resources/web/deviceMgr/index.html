<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- <link rel="icon" href="/favicon.ico"> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DevicePage</title>
      <script  defer src="./assets/BOGxP0ul.js"></script>
        <style>
            /*
             * Plain, native overlay button - deliberately kept outside the
             * Vue app (in this static HTML shell, not the compiled/minified
             * bundle) so a full page reload is always available even if the
             * app's own JS is in a broken state. It just calls
             * location.reload(), which re-fetches this whole page fresh,
             * equivalent to closing and reopening the Device tab.
             */
            #reload-page-btn {
                position: fixed;
                top: 12px;
                right: 16px;
                z-index: 2147483647;
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, 0.15);
                background: rgba(32, 33, 36, 0.65);
                color: #ffffff;
                cursor: pointer;
                padding: 0;
                transition: background 0.15s ease, transform 0.4s ease;
            }
            #reload-page-btn:hover {
                background: rgba(60, 62, 66, 0.85);
            }
            #reload-page-btn:active svg {
                transform: rotate(180deg);
            }
            #reload-page-btn svg {
                width: 16px;
                height: 16px;
                transition: transform 0.4s ease;
            }
        </style>
    </head>
    <body>
        <button id="reload-page-btn" type="button" title="Reload page" aria-label="Reload page" onclick="location.reload()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div id="app"></div>
        <script>
            (function () {
                if (!Array.isArray(window.__studioCmdQueue__)) {
                    window.__studioCmdQueue__ = [];
                }
                if (typeof window.handleStudioCmd !== 'function') {
                    window.handleStudioCmd = function (jsonData) {
                        window.__studioCmdQueue__.push(jsonData);
                    };
                }
            })();
        </script>
    </body>
</html>
